name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}

    strategy:
      fail-fast: false
      matrix:
        platform:
        - { name: Windows VS2026, os: windows-2025 }
        - { name: Linux GCC,      os: ubuntu-26.04 }
        - { name: Linux Clang,    os: ubuntu-26.04, flags: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ }
        - { name: macOS x64,      os: macos-26-intel }
        - { name: macOS ARM64,    os: macos-26 }

    steps:
    - name: PubBus - Checkout Code
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: SFML - Install Linux Dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install libx11-dev libfreetype-dev libxrandr-dev libxcursor-dev libudev-dev libgl1-mesa-dev libegl1-mesa-dev

    - name: SFML - Checkout Code
      uses: actions/checkout@v7
      with:
        repository: SFML/SFML
        path: SFML
        ref: 2.6.x
        persist-credentials: false

    - name: SFML - Configure CMake
      env:
        CMAKE_FLAGS: ${{ matrix.platform.flags }}
      run: cmake -S "$GITHUB_WORKSPACE/SFML" -B "$GITHUB_WORKSPACE/SFML/build" -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/SFML/install" -DSFML_BUILD_AUDIO=OFF -DSFML_BUILD_NETWORK=OFF -DBUILD_SHARED_LIBS=TRUE -DCMAKE_VERBOSE_MAKEFILE=ON $CMAKE_FLAGS

    - name: SFML - Build
      run: cmake --build "$GITHUB_WORKSPACE/SFML/build" --config Release --target install

    - name: PubBus - Configure CMake
      env:
        CMAKE_FLAGS: ${{ matrix.platform.flags }}
      run: cmake -S "$GITHUB_WORKSPACE" -B "$GITHUB_WORKSPACE/build" -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install" -DSFML_DIR="$GITHUB_WORKSPACE/SFML/install/lib/cmake/SFML" -DPUBBUS_INSTALL_EXAMPLE=ON -DCMAKE_VERBOSE_MAKEFILE=ON $CMAKE_FLAGS

    - name: PubBus - Build
      run: cmake --build "$GITHUB_WORKSPACE/build" --config Release --target install

    - name: PubBus - Test
      run: ctest -C Release --test-dir "$GITHUB_WORKSPACE/build/test"
